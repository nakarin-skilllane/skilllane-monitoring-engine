[package]
name = "ingest-rust"
version = "0.1.0"
edition = "2021"
description = "Benchmark prototype of the skilllane-monitoring ingest hot path (HTTP + Kafka → ClickHouse)"
publish = false

[lib]
name = "ingest_rust"
path = "src/lib.rs"

[[bin]]
name = "ingest-rust"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
rdkafka = { version = "0.37", default-features = false, features = ["cmake-build", "tokio", "libz-static"] }
ryu = "1"
url = "2"
bytes = "1"
futures = "0.3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
