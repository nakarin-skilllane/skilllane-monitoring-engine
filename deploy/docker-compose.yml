# skilllane-monitoring on one machine: ClickHouse + ingest + engine + monitor, no reverse proxy.
# The ingest, engine and monitor images are built here from this repo (setup-vm.sh clones it,
# builds and starts); the SDK and its wire contract come from npm (skilllane-monitoring).
#
#   cp ../.env.example ../.env && ln -s ../.env .env   # one .env at the repo root; fill the secrets
#   docker compose --profile rust build && docker compose --profile rust up -d
#
# Set INGEST_IMAGE / ENGINE_IMAGE / MONITOR_IMAGE / IMAGE_TAG to run images pulled from a registry
# instead (deploy/build-push.sh pushes them to GHCR); `docker compose pull` then.
#
# Who ingests = the profile, INGEST in .env (DEPLOY.md "Rollback"):
#   rust (default)  ingest (apps/ingest, Rust) takes HTTP + the queue on :5100; the engine runs
#                   ENGINE_ROLE=api with no published port (query API, auth, reports, schema, cold
#                   storage) and the monitor reaches it as http://engine:5100 on the compose network.
#   node            the engine ingests itself as before (service engine-all: ENGINE_ROLE=all, :5100,
#                   network alias `engine`); the ingest service does not run.
#   bullmq          add it to rust when LOG_EXPORT=bullmq: service bullmq-bridge (apps/bullmq-bridge)
#                   feeds the BullMQ jobs to the ingest over HTTP.
#   docker compose --profile $INGEST up -d   · switching: stop the other profile's services first
#   (compose does not stop a service whose profile is no longer active; DEPLOY.md has the commands).
#
# The monitor (http://localhost:3300) and ingest / engine-all (http://localhost:5100) are published on
# BIND_ADDRESS (default 127.0.0.1: this machine only; plain HTTP, no TLS). ClickHouse is on the
# compose network only. The queue is the customer's (LOG_* in .env); with none set it is HTTP
# ingest only.
name: skilllane-monitoring

# The engine image and everything that does not depend on the profile; `engine` and `engine-all`
# below differ only in ENGINE_ROLE and the published port (compose cannot vary `ports` by profile).
x-engine: &engine
  image: ${ENGINE_IMAGE:-skilllane-monitoring-engine}:${IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: deploy/Dockerfile.engine
  env_file: .env
  depends_on:
    clickhouse:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5100/api/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
    interval: 15s
    timeout: 10s
    retries: 5
    start_period: 40s
  deploy:
    resources:
      limits:
        memory: ${ENGINE_MEMORY_LIMIT:-1500m}
  restart: unless-stopped

# Inside the compose network; these win over anything in .env (ENGINE_ROLE too: the profile sets it).
x-engine-environment: &engine-environment
  CLICKHOUSE_URL: http://clickhouse:8123
  ENGINE_PORT: "5100"
  ENGINE_CORS_ORIGIN: ${ENGINE_CORS_ORIGIN:-http://localhost:3300}
  # Only with an S3 URL: without one the tables keep the default policy.
  CLICKHOUSE_COLD_STORAGE_POLICY: ${CLICKHOUSE_S3_URL:+tiered}
  # Daily report export (PNG / PDF).
  GOTENBERG_URL: http://gotenberg:3000

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    hostname: clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-skilllane_monitoring}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-skilllane_monitoring}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # Read by clickhouse-init/01-reader.sh at first start.
      CLICKHOUSE_READER_USER: ${CLICKHOUSE_READER_USER:-skilllane_monitoring_reader}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?set CLICKHOUSE_READER_PASSWORD in .env}
      # Cold storage (clickhouse-config/storage-s3.xml), optional: <URL>/<BUCKET>/clickhouse/.
      # URL unset: a placeholder disk nothing uses (ClickHouse does not start with an empty
      # endpoint). A missing bucket only stops the moves; nothing creates it.
      CLICKHOUSE_S3_ENDPOINT: ${CLICKHOUSE_S3_URL:-http://s3-not-configured.invalid}/${CLICKHOUSE_S3_BUCKET:-skilllane-monitoring}/clickhouse/
      CLICKHOUSE_S3_ACCESS_KEY_ID: ${CLICKHOUSE_S3_ACCESS_KEY_ID:-none}
      CLICKHOUSE_S3_SECRET_ACCESS_KEY: ${CLICKHOUSE_S3_SECRET_ACCESS_KEY:-none}
      CLICKHOUSE_S3_REGION: ${CLICKHOUSE_S3_REGION:-us-east-1}
    volumes:
      - ./clickhouse-init/01-reader.sh:/docker-entrypoint-initdb.d/01-reader.sh:ro
      - ./clickhouse-config/storage-s3.xml:/etc/clickhouse-server/config.d/storage-s3.xml:ro
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: ${CLICKHOUSE_MEMORY_LIMIT:-0}   # 0 = no limit
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # ---- profile rust (INGEST=rust, default) --------------------------------------------------
  # Rust ingest (apps/ingest): POST /api/ingest/<stream> + the queue consumer, writes ClickHouse.
  # Reads the same .env as the engine (SPEC.md section 5; LOG_*, ENGINE_INGEST_*, ENGINE_FLUSH_*,
  # ENGINE_CONCURRENCY, ENGINE_INSERT_INFLIGHT). It does not apply the schema: it waits for the
  # engine (healthy = schema applied) and then for the tables itself.
  ingest:
    image: ${INGEST_IMAGE:-skilllane-monitoring-ingest}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ingest
    profiles: [rust]
    env_file: .env
    environment:
      # Inside the compose network; these win over anything in .env.
      CLICKHOUSE_URL: http://clickhouse:8123
      ENGINE_PORT: "5100"
    # HTTP ingest. 127.0.0.1 by default: no TLS, so keep it off the network.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5100:5100"
    depends_on:
      clickhouse:
        condition: service_healthy
      engine:
        condition: service_healthy
    # No healthcheck: the image is distroless (no shell, no curl) and the binary has no health
    # subcommand. From the host: curl http://localhost:5100/api/health; `docker compose logs ingest`
    # prints a stats line every 30 s.
    deploy:
      resources:
        limits:
          memory: ${INGEST_MEMORY_LIMIT:-512m}
    restart: unless-stopped

  # ---- profile bullmq (with rust, only when LOG_EXPORT=bullmq) ----------------------------------
  # BullMQ reaches the Rust ingest through this small Node service (apps/bullmq-bridge, the same
  # bullmq library as the engine's consumer): it takes the jobs from LOG_BULLMQ_REDIS_URL and POSTs
  # each envelope to the ingest (202 = complete, 400 = unrecoverable, 503 / network = retry).
  #   docker compose --profile rust --profile bullmq up -d
  bullmq-bridge:
    image: ${BULLMQ_BRIDGE_IMAGE:-skilllane-monitoring-bullmq-bridge}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bullmq-bridge
    profiles: [bullmq]
    env_file: .env
    environment:
      # LOG_BULLMQ_REDIS_URL, LOG_BULLMQ_PREFIX, LOG_TOPIC_*, ENGINE_CONCURRENCY and ENGINE_INGEST_TOKEN come from .env.
      INGEST_URL: http://ingest:5100
    depends_on:
      ingest:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5110/api/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${BULLMQ_BRIDGE_MEMORY_LIMIT:-256m}
    restart: unless-stopped

  # The engine next to the Rust ingest: query API, auth, reports, AI, schema apply, cold storage.
  # No ingest module and no published port; the monitor reaches it as http://engine:5100.
  engine:
    <<: *engine
    profiles: [rust]
    environment:
      <<: *engine-environment
      ENGINE_ROLE: api

  # ---- profile node (INGEST=node: rollback) ---------------------------------------------------
  # The engine ingests itself as before (HTTP ingest + consumer + query API) on :5100. Same image
  # and settings as `engine`; the network alias keeps the monitor's ENGINE_URL valid.
  engine-all:
    <<: *engine
    profiles: [node]
    networks:
      default:
        aliases: [engine]
    environment:
      <<: *engine-environment
      ENGINE_ROLE: all
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:5100:5100"

  monitor:
    image: ${MONITOR_IMAGE:-skilllane-monitoring-monitor}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.monitor
    environment:
      ENGINE_URL: http://engine:5100
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3300:3300"
    # Whichever engine the profile runs (required: false = the other one, not enabled, is ignored).
    depends_on:
      engine:
        condition: service_healthy
        required: false
      engine-all:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3300/login',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: ${MONITOR_MEMORY_LIMIT:-1g}
    restart: unless-stopped

  # HTML → PNG / PDF for the daily report export; only the engine calls it (compose network).
  gotenberg:
    image: gotenberg/gotenberg:8.37.0-chromium
    command: ["gotenberg", "--chromium-start-timeout=60s", "--api-timeout=60s"]
    deploy:
      resources:
        limits:
          memory: ${GOTENBERG_MEMORY_LIMIT:-1g}
    restart: unless-stopped

volumes:
  clickhouse-data:
  clickhouse-logs:
