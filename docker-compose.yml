# skilllane-monitoring engine infrastructure (SPEC.md section 6). Infra only: the engine
# and the demo apps run on the host. Kafka / RabbitMQ / redis-telemetry stand
# in for the customer's queue; redis-app is the demo app's own Redis.
# Optional (profile `ingest`): the Rust ingest (apps/ingest) in a container, wired to these
# brokers, for scripts/demo.sh and manual runs: LOG_EXPORT=kafka docker compose --profile ingest up -d ingest
name: skilllane-monitoring-engine

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    hostname: clickhouse
    environment:
      CLICKHOUSE_DB: skilllane_monitoring
      CLICKHOUSE_USER: skilllane_monitoring
      CLICKHOUSE_PASSWORD: skilllane_monitoring
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./clickhouse/users.sql:/docker-entrypoint-initdb.d/02-users.sql:ro
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123"
      - "19000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # HTML → PNG / PDF for the daily report export (GOTENBERG_URL=http://localhost:3030).
  gotenberg:
    image: gotenberg/gotenberg:8.37.0-chromium
    command: ["gotenberg", "--chromium-start-timeout=60s", "--api-timeout=60s"]
    ports:
      - "127.0.0.1:3030:3000"
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      CLUSTER_ID: yKQI6JZmRAycuSHHs8S2cQ
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # EXTERNAL = apps on this machine (localhost:29092); DOCKER = containers on this machine,
      # e.g. the deploy/ stack's engine (LOG_KAFKA_BROKERS=host.docker.internal:29093)
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,DOCKER://:29093,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092,DOCKER://host.docker.internal:29093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_MESSAGE_MAX_BYTES: 1048588
      KAFKA_HEAP_OPTS: -Xmx768M -Xms768M
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports:
      - "29092:29092"
      - "29093:29093"
    healthcheck:
      # Docker leaves a timed-out check running, and the client JVM would
      # inherit the broker's 768M heap — cap both or stuck checks pile up.
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS='-Xms32m -Xmx128m' timeout 10 /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: skilllane_monitoring
      RABBITMQ_DEFAULT_PASS: skilllane_monitoring
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # The customer's Redis for the BullMQ transport (telemetry only).
  redis-telemetry:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis-telemetry-data:/data
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The demo app's own Redis (cache + business jobs); scripts/chaos-redis.sh stops it.
  redis-app:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-app-data:/data
    ports:
      - "6391:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # The Rust ingest (apps/ingest) against this stack's brokers; off unless --profile ingest.
  # Same variables as the engine (SPEC.md section 5); LOG_EXPORT picks the consumer (kafka |
  # rabbitmq | bullmq; empty = HTTP only) and is taken from the environment or .env, as demo.sh
  # exports it. The tables come from docker initdb (clickhouse/schema.sql); the ingest does not
  # apply the schema. Published on :5100 like the engine run on the host (DEMO_ENGINE_PORT): run
  # that one as ENGINE_ROLE=api on another port, or set INGEST_PORT.
  ingest:
    profiles: [ingest]
    build:
      context: ./apps/ingest
    image: skilllane-monitoring-ingest:dev
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: skilllane_monitoring
      CLICKHOUSE_PASSWORD: skilllane_monitoring
      CLICKHOUSE_DATABASE: skilllane_monitoring
      ENGINE_PORT: "5100"
      LOG_EXPORT: ${LOG_EXPORT:-}
      LOG_KAFKA_BROKERS: kafka:9092
      LOG_RABBITMQ_URL: amqp://skilllane_monitoring:skilllane_monitoring@rabbitmq:5672/
      LOG_BULLMQ_REDIS_URL: redis://redis-telemetry:6379/0
      LOG_BULLMQ_PREFIX: ${LOG_BULLMQ_PREFIX:-bull}
      LOG_RABBITMQ_EXCHANGE: ${LOG_RABBITMQ_EXCHANGE:-skilllane-monitoring.telemetry}
      LOG_TOPIC_LOGS: ${LOG_TOPIC_LOGS:-skilllane-monitoring.logs}
      LOG_TOPIC_SPANS: ${LOG_TOPIC_SPANS:-skilllane-monitoring.spans}
      ENGINE_CONSUMER_GROUP: ${ENGINE_CONSUMER_GROUP:-skilllane-monitoring-engine}
      ENGINE_CONCURRENCY: ${ENGINE_CONCURRENCY:-50}
      ENGINE_FLUSH_MS: ${ENGINE_FLUSH_MS:-1000}
      ENGINE_FLUSH_ROWS: ${ENGINE_FLUSH_ROWS:-5000}
      ENGINE_INSERT_INFLIGHT: ${ENGINE_INSERT_INFLIGHT:-1}
      ENGINE_INGEST_HTTP: ${ENGINE_INGEST_HTTP:-true}
      ENGINE_INGEST_TOKEN: ${ENGINE_INGEST_TOKEN:-}
    ports:
      - "127.0.0.1:${INGEST_PORT:-5100}:5100"
    depends_on:
      clickhouse:
        condition: service_healthy
    # The brokers are optional (HTTP-only runs): the ingest retries the consumer itself at start.
    restart: unless-stopped

  # BullMQ → ingest bridge (apps/bullmq-bridge): the ingest has no BullMQ consumer; this takes the
  # jobs from redis-telemetry and POSTs them to the ingest. Only does anything with LOG_EXPORT=bullmq.
  bullmq-bridge:
    profiles: [ingest]
    build:
      context: .
      dockerfile: deploy/Dockerfile.bullmq-bridge
    image: skilllane-monitoring-bullmq-bridge:dev
    environment:
      INGEST_URL: http://ingest:5100
      LOG_BULLMQ_REDIS_URL: redis://redis-telemetry:6379/0
      LOG_BULLMQ_PREFIX: ${LOG_BULLMQ_PREFIX:-bull}
      LOG_TOPIC_LOGS: ${LOG_TOPIC_LOGS:-skilllane-monitoring.logs}
      LOG_TOPIC_SPANS: ${LOG_TOPIC_SPANS:-skilllane-monitoring.spans}
      ENGINE_CONCURRENCY: ${ENGINE_CONCURRENCY:-50}
      ENGINE_INGEST_TOKEN: ${ENGINE_INGEST_TOKEN:-}
    ports:
      - "127.0.0.1:${BULLMQ_BRIDGE_PORT:-5110}:5110"
    depends_on:
      ingest:
        condition: service_started
      redis-telemetry:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clickhouse-data:
  clickhouse-logs:
  kafka-data:
  rabbitmq-data:
  redis-telemetry-data:
  redis-app-data:
